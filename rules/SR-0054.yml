uid: SR-0054
type: system_requirement
status: approved
title: Use one encoding, preferably UTF-8, for non-ASCII characters
text: >-
  When non-ASCII characters are needed, stick to a single encoding, certainly within a
  file, and prefer UTF-8.
links:
- target: UR-0009
  type: implements
