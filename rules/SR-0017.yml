uid: SR-0017
type: system_requirement
status: approved
title: Do not capitalise a lower-case identifier at the start of a sentence
text: >-
  Do not capitalise a lower-case identifier that begins a sentence, since changing its
  spelling makes it a different identifier; reword the sentence instead.
links:
- target: UR-0002
  type: implements
attrs:
  source_ref: "GNU Coding Standards: Comments — Identifiers in Prose"
