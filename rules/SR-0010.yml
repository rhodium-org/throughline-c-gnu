uid: SR-0010
type: system_requirement
status: approved
title: Add extra parentheses so indentation shows the nesting
text: >-
  Avoid two operators of different precedence at the same indentation level; add extra
  parentheses so the indentation reflects the nesting and Emacs indents the code
  correctly.
