uid: SR-0044
type: system_requirement
status: approved
title: Do not assume long is as wide as a pointer or size_t
text: >-
  Do not assume long is as wide as a pointer or size_t, and beware that file-size types
  like off_t are wider than long on many platforms; print such values portably.
links:
- target: UR-0006
  type: implements
attrs:
  source_ref: "GNU Coding Standards: CPU Portability — Pointer Width"
