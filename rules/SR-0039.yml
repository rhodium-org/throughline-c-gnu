uid: SR-0039
type: system_requirement
status: approved
title: Use Autoconf to achieve system portability
text: >-
  Use Autoconf as the easiest way to achieve portability to most Unix-like systems, rather
  than hard-coding assumptions about the host platform.
links:
- target: UR-0005
  type: implements
attrs:
  source_ref: "GNU Coding Standards: System Portability — Autoconf"
