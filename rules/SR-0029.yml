uid: SR-0029
type: system_requirement
status: approved
title: Declare a structure tag separately from its variables or typedefs
text: >-
  Do not declare a structure tag together with variables or typedefs in the same
  declaration; declare the tag separately and then use it.
links:
- target: UR-0003
  type: implements
attrs:
  source_ref: "GNU Coding Standards: Clean Use of C Constructs — Declarations"
