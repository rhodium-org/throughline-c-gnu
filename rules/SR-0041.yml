uid: SR-0041
type: system_requirement
status: approved
title: Do not reuse the names of GNU extension functions for other meanings
text: >-
  Whether or not you use the GNU extensions, avoid reusing their function names for other
  meanings, so the code can move into other GNU programs.
links:
- target: UR-0005
  type: implements
attrs:
  source_ref: "GNU Coding Standards: System Portability — Names"
