uid: SR-0034
type: system_requirement
status: approved
title: Separate words in a name with underscores
text: >-
  Use underscores to separate words in a name so the Emacs word commands work within them;
  write ignore_space_change_flag, not iCantReadThis.
links:
- target: UR-0004
  type: implements
attrs:
  source_ref: "GNU Coding Standards: Naming — Word Separation"
