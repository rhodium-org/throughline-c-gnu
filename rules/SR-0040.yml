uid: SR-0040
type: system_requirement
status: approved
title: Define the _GNU_SOURCE feature-test macro
text: >-
  Define the _GNU_SOURCE feature-test macro when compiling your C files so GNU library
  extension declarations are enabled and conflicting redefinitions are caught.
links:
