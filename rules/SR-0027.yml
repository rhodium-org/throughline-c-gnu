uid: SR-0027
type: system_requirement
status: approved
title: Always brace an if-else nested inside another if
text: >-
  Always put braces around an if-else statement that is nested inside another if, so the
  else cannot bind to the wrong if.
links:
- target: UR-0003
  type: implements
attrs:
  source_ref: "GNU Coding Standards: Clean Use of C Constructs — Nested Conditionals"
