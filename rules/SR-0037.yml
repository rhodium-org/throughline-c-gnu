uid: SR-0037
type: system_requirement
status: approved
title: Define integer constants with enum rather than #define
text: >-
  Use an enum rather than #define to define names with constant integer values, since
  debuggers such as GDB know about enumeration constants.
links:
- target: UR-0004
  type: implements
attrs:
  source_ref: "GNU Coding Standards: Naming — Constants"
