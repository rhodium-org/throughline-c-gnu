uid: SR-0047
type: system_requirement
status: approved
title: Use standard C and POSIX interfaces where possible
text: >-
  Use standard C and POSIX interfaces where possible, taking advantage of them for
  clearer, more portable or faster code; use a GNU extension where it genuinely makes the
  program better.
