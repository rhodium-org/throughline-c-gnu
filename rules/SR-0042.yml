uid: SR-0042
type: system_requirement
status: approved
title: Do not abbreviate Windows as "win"
text: >-
  If you support Windows, do not abbreviate it as "win"; write "Windows" in full,
  abbreviating to "w" (as in w32) only where brevity is essential.
links:
- target: UR-0005
  type: implements
attrs:
  source_ref: "GNU Coding Standards: System Portability — Windows Naming"
