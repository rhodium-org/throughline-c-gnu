uid: SR-0050
type: system_requirement
status: approved
title: Wrap user-visible strings in gettext for translation
text: >-
  Use GNU gettext in every program: write messages in English and wrap each string that
  may need translation in a gettext call, adding gettext to new translatable strings as
  you write them.
links:
- target: UR-0008
  type: implements
attrs:
  source_ref: "GNU Coding Standards: Internationalization — gettext"
