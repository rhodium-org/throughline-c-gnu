uid: SR-0021
type: system_requirement
status: approved
title: Explicitly declare the types of all objects
text: >-
  Explicitly declare the types of all objects, including all function arguments, and
  declare a function to return int rather than omitting the type.
links:
- target: UR-0003
  type: implements
attrs:
  source_ref: "GNU Coding Standards: Clean Use of C Constructs — Explicit Types"
